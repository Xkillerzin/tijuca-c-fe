  <style>
    .mensagem {
      max-width: 600px;
      margin: 4rem auto;
      padding: 2rem;
      background-color: #fff3e0;
      border-radius: 8px;
      text-align: center;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .mensagem h2 {
      color: #4e342e;
      font-size: 2rem;
      margin-bottom: 1rem;
    }

    .mensagem p {
      font-size: 1.1rem;
      color: #333;
      margin-bottom: 2rem;
    }

    .mensagem a {
      display: inline-block;
      padding: 0.8rem 1.5rem;
      background-color: #c8a97e;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
      transition: background 0.3s;
    }

    .mensagem a:hover {
      background-color: #a67c52;
    }
  </style>
